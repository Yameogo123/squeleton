[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.package_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
authors = [{ name = "{{ cookiecutter.author_name }}" }]
readme = "README.md"
{%- if cookiecutter.open_source_license != 'No license file' %}
license = { text = "{{ cookiecutter.open_source_license }}" }
{%- endif %}
keywords = ["fastapi", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
requires-python = ">={{ cookiecutter.python_version }}"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 120
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
src = ["src", "app", "tests"]

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, S: bandit (security), UP: pyupgrade, ASYNC: blocking calls in async code
select = ["E", "F", "I", "B", "S", "UP", "ASYNC", "SIM"]
ignore = ["B008"]  # Depends()/File() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src", "app"]

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
ignore_missing_imports = true
