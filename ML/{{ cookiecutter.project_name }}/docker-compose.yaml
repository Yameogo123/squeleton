services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "8501:8501"
    working_dir: /app/app/frontend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
